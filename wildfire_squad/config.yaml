# Wildfire Containment Squad — all simulation parameters.
# Values marked "Review 1" are the design values presented in Review 1 and must not change.
# Keys marked "impl" are implementation details that Review 1 did not fix.

seed: 42

grid:
  width: 50
  height: 50
  tree_density: 0.85          # fraction of land cells that are Tree
  sparse_region_fraction: 0.3 # fraction of trees in sparse regions (fuel 0.5)
  lakes: 2                    # random water bodies (ignored if a preset map is used)
  base_station: [2, 2]        # all agents start here
  base_clear_radius: 3        # impl: no lakes or ignitions within this Chebyshev radius of base
  lake_radius: [3, 6]         # impl: min/max semi-axis of a random lake blob
  lake_edge_noise: 0.35       # impl: roughness of lake shores
  sparse_patch_size: [6, 14]  # impl: min/max side length of a sparse-forest patch

fire:
  ignitions: 1                # number of initial burning cells
  p_base: 0.3
  fuel_dense: 1.0
  fuel_sparse: 0.5
  wind_k: 0.8                 # wind strength factor k
  wind_direction_deg: 0       # 0 = wind blowing toward +x (east); 90 = toward +y
  burn_duration: 4            # steps a cell burns before becoming Burnt
  spread_neighbourhood: 8     # fire spreads to 8 neighbours
  spread_every: 5             # impl: fire updates once every N agent steps (1 = literal Review 1 timing; see README)
  ignition_min_base_distance: 15  # ignitions at least this far (Chebyshev) from base
  ignition_min_separation: 15     # multiple ignitions at least this far apart

agents:
  n_scouts: 3
  n_firefighters: 5
  scout_sense_radius: 3
  firefighter_sense_radius: 1
  water_max: 10
  extinguish_water_cost: 1

scout:
  stale_after: 15             # cells older than this become frontier again
  target_exclusion_radius: 5  # ignore targets within 5 cells of another scout's target

firefighter:
  risk_lambda: 5.0
  replan_every: 10            # also replan immediately if next cell is burning
  blocked_replan_after: 2     # replan if the next cell stays reserved this many steps in a row
  zone_tactic: utility        # target inside a zone: utility (spread stopped per step of travel) | firebreak (downwind edge, plan §7.2) | nearest
  target_candidates: 5        # impl: firebreak candidates checked for reachability per re-target
  explore_when_idle: true     # impl: free firefighters explore when the team knows of no fire
  award_timeout: 10           # no AWARD for this many steps while fire is known -> fight nearest fire alone (null = never)
  secure_footing: true        # impl: never fight from fuel: cut own cell first; do not step onto fuel beside fire as it spreads

coordinator:
  cluster_every: 5            # re-cluster zones + run auctions every 5 steps
  zone_link_distance: 1       # burning cells this close (Chebyshev) share a zone; 1 = 8-connectivity
  large_zone_cells: 20        # zones larger than this are auctioned twice (2 firefighters)
  reauction_after_absent: 15  # re-auction a zone if its firefighter is away refilling > 15 steps
  assign_idle: true           # impl: after the design slots, auction leftover free firefighters too
  fail_at_step: null          # robustness test: the Coordinator stops working from this step (null = never)

simulation:
  t_max: 300
  strategy: auction           # independent | greedy | auction
  preset: null                # null = random forest | river (Scenario 6 map)
  measure_ucs: true           # also run UCS on every A* query (measurement only)
  message_log_size: 200       # recent messages kept for the demo panel
  oracle_knowledge: false     # studies only: firefighters see the true fire state (upper bound)

presets:
  river:
    x: 25                     # vertical water column
    crossings: [[10, 12], [38, 40]]   # inclusive y-ranges of the 3-cell-wide crossings
  competing:                  # targeted test of threat-aware allocation (not a Review 1 scenario)
    near_ignition: [17, 5]    # low-threat fire in sparse forest, close to the base
    far_ignition: [28, 34]    # high-threat fire in dense forest, farther away
    patch_radius: 6           # forest type forced around each ignition

score:
  w1: 0.7
  w2: 0.2
  w3: 0.1

experiments:
  runs_per_scenario: 30
